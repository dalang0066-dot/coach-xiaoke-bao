<!-- Form Body -->
<div class="p-6 overflow-y-auto max-h-[618px] hide-scrollbar space-y-4">
<!-- Avatar Selection -->
<div class="flex flex-col items-center justify-center space-y-2">
<button class="relative w-24 h-24 rounded-full bg-primary-container/10 flex items-center justify-center group overflow-hidden ring-4 ring-primary/5 hover:ring-primary/20 transition-all active:scale-95">

<div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
<span class="material-symbols-outlined text-white text-display-lg" data-icon="refresh">refresh</span>
</div>
</button>
</div>
<!-- Basic Info -->
<div class="space-y-4">
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-secondary px-1">姓名</label>
<input class="w-full h-touch-target-min bg-surface-container border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-lg px-3 text-body-main transition-colors" placeholder="输入学员姓名" type="text"/>
</div>
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-secondary px-1">课时数</label>
<input class="w-full h-touch-target-min bg-surface-container border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-lg px-3 text-body-main font-numeric-data transition-colors" placeholder="0" type="number"/>
</div>
</div>
<!-- Quick Selection Buttons -->
<div class="flex gap-2">
<button class="flex-1 py-2 rounded-xl border border-outline-variant text-on-surface-variant font-numeric-data text-body-main hover:bg-primary-container/20 hover:border-primary/30 transition-all active:scale-95">12节</button>
<button class="flex-1 py-2 rounded-xl border border-outline-variant text-on-surface-variant font-numeric-data text-body-main hover:bg-primary-container/20 hover:border-primary/30 transition-all active:scale-95">24节</button>
<button class="flex-1 py-2 rounded-xl border-2 border-primary bg-primary-container/10 text-primary font-numeric-data text-body-main active:scale-95">36节</button>

<label class="font-label-caps text-label-caps text-secondary px-1">有效期至（默认6个月）</label>

<input class="w-full h-touch-target-min bg-surface-container border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-lg px-3 text-body-main transition-colors cursor-pointer" readonly="" type="text" value="2026-05-12"/>
</div>
</div>

<div class="space-y-1">
<label class="font-label-caps text-label-caps text-secondary px-1">备注</label>
